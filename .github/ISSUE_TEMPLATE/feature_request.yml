name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like, and why?
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Help
      options:
        - label: I can implement this and test it on the live site
