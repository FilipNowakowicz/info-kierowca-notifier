[project]
name = "info-kierowca-notifier"
dynamic = ["version"]
description = "Read-only availability notifier for info-kierowca.pl driving-exam slots"
requires-python = ">=3.9"
dependencies = [
    "certifi>=2025.0",
    "keyring>=25.6,<25.7",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "truststore>=0.10,<1; python_version >= '3.10'",
]

[project.scripts]
info-kierowca-notifier = "info_kierowca_notifier.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/info_kierowca_notifier"]

[tool.hatch.build.targets.wheel.force-include]
"src/info_kierowca_notifier/data/categories.json" = "info_kierowca_notifier/data/categories.json"
"src/info_kierowca_notifier/data/word_centers.json" = "info_kierowca_notifier/data/word_centers.json"

[tool.hatch.version]
path = "src/info_kierowca_notifier/paths.py"

[dependency-groups]
dev = [
    "pyflakes==3.3.2",
    "pyinstaller==6.21.0",
]
