[project]
name = "info-kierowca-notifier"
version = "2.0.1"
description = "Read-only availability notifier for info-kierowca.pl driving-exam slots"
requires-python = ">=3.9"
dependencies = [
    "certifi>=2025.0",
    "keyring>=25.6,<25.7",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "truststore>=0.10,<1; python_version >= '3.10'",
]

[dependency-groups]
dev = [
    "pyflakes==3.3.2",
    "pyinstaller==6.21.0",
]

[tool.uv]
package = false
